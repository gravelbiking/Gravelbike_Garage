<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510" role="img" aria-labelledby="title desc"><title id="title">Reifenpark 1.3.3 - logisches Datenmodell und Wechselablauf</title><desc id="desc">Reifen-Steckbriefe referenzieren dieselben Exemplare wie Fahrradkomponenten und Lagerpositionen. Die Montagehistorie wird aus diesen Quellen berechnet. Ein serverseitiger Schnellwechsel schreibt alle Änderungen atomar.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#597567"/></marker></defs><rect width="1800" height="1510" fill="#f7f8f3"/><text x="60" y="62" font-family="Arial, sans-serif" font-size="42" fill="#233d32" font-weight="700">Reifenpark</text><text x="60" y="101" font-family="Arial, sans-serif" font-size="24" fill="#637367">Version 1.3.3 · Logischer Aufbau und Funktionen · 21.11.2026</text><rect x="40" y="140" width="1720" height="1035" rx="24" fill="#edf2e8" stroke="#b9cbbd"/><text x="70" y="183" font-family="Arial, sans-serif" font-size="25" fill="#233d32" font-weight="700">Eigene Instanz: MariaDB + private Dateiablage</text><text x="70" y="212" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Fachdaten: gt_garage, Zeile id = 1, Spalte data (JSON). Keine neuen SQL-Tabellen für einzelne Reifen.</text><rect x="80" y="245" width="500" height="250" rx="18" fill="white" stroke="#b9cbbd" stroke-width="2"/><path d="M98,245H562Q580,245 580,263V310H80V263Q80,245 98,245" fill="#e8efe2"/><text x="100" y="272" font-family="Arial, sans-serif" font-size="15" fill="#637367">JSON · gt_garage.data</text><text x="100" y="299" font-family="Arial, sans-serif" font-size="24" fill="#233d32" font-weight="700">tireProfiles[] · Reifen-Steckbrief</text><text x="100" y="341" font-family="Arial, sans-serif" font-size="20" fill="#233d32">id = stabile Exemplar-ID</text><text x="100" y="370" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Optionale technische Daten + photo</text><text x="100" y="399" font-family="Arial, sans-serif" font-size="20" fill="#233d32">pairId + pairRole: optionales Paar</text><text x="100" y="428" font-family="Arial, sans-serif" font-size="20" fill="#233d32">usageState + initialMileage</text><text x="100" y="457" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Keine eigene Bestandsmenge</text><rect x="650" y="245" width="500" height="250" rx="18" fill="white" stroke="#b9cbbd" stroke-width="2"/><path d="M668,245H1132Q1150,245 1150,263V310H650V263Q650,245 668,245" fill="#e8efe2"/><text x="670" y="272" font-family="Arial, sans-serif" font-size="15" fill="#637367">JSON · gt_garage.data</text><text x="670" y="299" font-family="Arial, sans-serif" font-size="24" fill="#233d32" font-weight="700">bikes[].components[]</text><text x="670" y="341" font-family="Arial, sans-serif" font-size="20" fill="#233d32">tireId → dasselbe Reifenexemplar</text><text x="670" y="370" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Aktuelles Fahrrad + vorne / hinten</text><text x="670" y="399" font-family="Arial, sans-serif" font-size="20" fill="#233d32">installedDate + installedKm</text><text x="670" y="428" font-family="Arial, sans-serif" font-size="20" fill="#233d32">tireHistory[]: abgeschlossene Perioden</text><text x="670" y="457" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Aktuelle Laufleistung aus Fahrrad-km</text><rect x="1220" y="245" width="500" height="250" rx="18" fill="white" stroke="#b9cbbd" stroke-width="2"/><path d="M1238,245H1702Q1720,245 1720,263V310H1220V263Q1220,245 1238,245" fill="#e8efe2"/><text x="1240" y="272" font-family="Arial, sans-serif" font-size="15" fill="#637367">JSON · gt_garage.data</text><text x="1240" y="299" font-family="Arial, sans-serif" font-size="24" fill="#233d32" font-weight="700">inventory[].positions[]</text><text x="1240" y="341" font-family="Arial, sans-serif" font-size="20" fill="#233d32">tire.id → dasselbe Reifenexemplar</text><text x="1240" y="370" font-family="Arial, sans-serif" font-size="20" fill="#233d32">tire.component + tire.history[]</text><text x="1240" y="399" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Menge 1 = eingelagert, 0 = entnommen</text><text x="1240" y="428" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Lagerort + movements[] als Journal</text><text x="1240" y="457" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Vorhandener Bestand wird umgebucht</text><path d="M580 365 L650 365" fill="none" stroke="#597567" stroke-width="2.5" marker-end="url(#arrow)"/><text x="595.0" y="353.0" font-family="Arial, sans-serif" font-size="16" fill="#233d32">tireId</text><path d="M1150 365 L1220 365" fill="none" stroke="#597567" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1165.0" y="353.0" font-family="Arial, sans-serif" font-size="16" fill="#233d32">tireId</text><rect x="80" y="610" width="500" height="230" rx="18" fill="white" stroke="#b9cbbd" stroke-width="2"/><path d="M98,610H562Q580,610 580,628V675H80V628Q80,610 98,610" fill="#dfeaf1"/><text x="100" y="637" font-family="Arial, sans-serif" font-size="15" fill="#637367">Separat: gt_files + private Dateien</text><text x="100" y="664" font-family="Arial, sans-serif" font-size="24" fill="#233d32" font-weight="700">Foto / Datei</text><text x="100" y="706" font-family="Arial, sans-serif" font-size="20" fill="#233d32">photo → gt_files.id</text><text x="100" y="735" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Dateiname, MIME-Typ, Größe in SQL</text><text x="100" y="764" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Bildinhalt im privaten Upload-Speicher</text><text x="100" y="793" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Zugriff nur mit gültiger Anmeldung</text><rect x="650" y="610" width="500" height="230" rx="18" fill="white" stroke="#b9cbbd" stroke-width="2"/><path d="M668,610H1132Q1150,610 1150,628V675H650V628Q650,610 668,610" fill="#e8efe2"/><text x="670" y="637" font-family="Arial, sans-serif" font-size="15" fill="#637367">JSON · gt_garage.data</text><text x="670" y="664" font-family="Arial, sans-serif" font-size="24" fill="#233d32" font-weight="700">history[] · Fahrrad-Lebenslauf</text><text x="670" y="706" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Fahrrad-ID + Datum + Kilometerstand</text><text x="670" y="735" font-family="Arial, sans-serif" font-size="20" fill="#233d32">tireChange: ausgebaut / eingebaut</text><text x="670" y="764" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Vollständiger Wechselnachweis</text><text x="670" y="793" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Kein Werkstattauftrag erforderlich</text><rect x="1220" y="610" width="500" height="230" rx="18" fill="white" stroke="#b9cbbd" stroke-width="2"/><path d="M1238,610H1702Q1720,610 1720,628V675H1220V628Q1220,610 1238,610" fill="#e8efe2"/><text x="1240" y="637" font-family="Arial, sans-serif" font-size="15" fill="#637367">JSON · gt_garage.data</text><text x="1240" y="664" font-family="Arial, sans-serif" font-size="24" fill="#233d32" font-weight="700">tireParkOperations[]</text><text x="1240" y="706" font-family="Arial, sans-serif" font-size="20" fill="#233d32">operationId + Hash der Anfrage</text><text x="1240" y="735" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Aktion + Reifen-ID + Zeitpunkt</text><text x="1240" y="764" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Wiederholte Anfrage → keine Duplikate</text><text x="1240" y="793" font-family="Arial, sans-serif" font-size="20" fill="#233d32">Zusätzlich: Versionsprüfung + DB-Sperre</text><path d="M330 495 L330 610" fill="none" stroke="#597567" stroke-width="2.5" marker-end="url(#arrow)"/><text x="342.0" y="552.5" font-family="Arial, sans-serif" font-size="16" fill="#233d32">photo → Datei-ID</text><path d="M900 495 L900 610" fill="none" stroke="#597567" stroke-width="2.5" marker-end="url(#arrow)"/><text x="912.0" y="552.5" font-family="Arial, sans-serif" font-size="16" fill="#233d32">bikeId → Lebenslauf</text><path d="M1470 495 L1470 610" fill="none" stroke="#597567" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1482.0" y="552.5" font-family="Arial, sans-serif" font-size="16" fill="#233d32">Vorgang zusammen speichern</text><rect x="80" y="900" width="1640" height="215" rx="18" fill="#233e32"/><text x="105" y="943" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">Reifenpark-Ansicht: berechnet, keine zweite Bestandsverwaltung</text><text x="105" y="990" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Alle · Montiert · Eingelagert</text><text x="105" y="1024" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Jedes Exemplar hat seinen Steckbrief</text><text x="105" y="1058" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Paare: getrennte Vorder-/Hinterreifen</text><text x="645" y="990" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Montagehistorie über alle Fahrräder</text><text x="645" y="1024" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Je Periode: Fahrrad, Position, Datum, km</text><text x="645" y="1058" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Abgeschlossene Kilometer bleiben fest</text><text x="1190" y="990" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Neu: bestätigt neu, nie montiert</text><text x="1190" y="1024" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Gesamt-km = vorher + Montageperioden</text><text x="1190" y="1058" font-family="Arial, sans-serif" font-size="20" fill="#f1f5eb">Unbekannte Werte bleiben unbekannt</text><text x="60" y="1230" font-family="Arial, sans-serif" font-size="29" fill="#233d32" font-weight="700">Schnellwechsel am Fahrrad</text><rect x="60" y="1260" width="400" height="145" rx="16" fill="white" stroke="#b9cbbd"/><text x="78" y="1297" font-family="Arial, sans-serif" font-size="23" fill="#233d32" font-weight="700">1 · Auswählen</text><text x="78" y="1335" font-family="Arial, sans-serif" font-size="19" fill="#233d32">Welcher Reifen kommt runter?</text><text x="78" y="1365" font-family="Arial, sans-serif" font-size="19" fill="#233d32">Welcher verfügbare Reifen drauf?</text><path d="M462 1330 L492 1330" fill="none" stroke="#597567" stroke-width="2.5" marker-end="url(#arrow)"/><text x="457.0" y="1318.0" font-family="Arial, sans-serif" font-size="16" fill="#233d32"></text><rect x="495" y="1260" width="400" height="145" rx="16" fill="white" stroke="#b9cbbd"/><text x="513" y="1297" font-family="Arial, sans-serif" font-size="23" fill="#233d32" font-weight="700">2 · Prüfen</text><text x="513" y="1335" font-family="Arial, sans-serif" font-size="19" fill="#233d32">Anmeldung, Datum, Verfügbarkeit</text><text x="513" y="1365" font-family="Arial, sans-serif" font-size="19" fill="#233d32">Versionsstand + Zeilensperre</text><path d="M897 1330 L927 1330" fill="none" stroke="#597567" stroke-width="2.5" marker-end="url(#arrow)"/><text x="892.0" y="1318.0" font-family="Arial, sans-serif" font-size="16" fill="#233d32"></text><rect x="930" y="1260" width="400" height="145" rx="16" fill="white" stroke="#b9cbbd"/><text x="948" y="1297" font-family="Arial, sans-serif" font-size="23" fill="#233d32" font-weight="700">3 · Gemeinsam speichern</text><text x="948" y="1335" font-family="Arial, sans-serif" font-size="19" fill="#233d32">Ausbau + Lager + Einbau</text><text x="948" y="1365" font-family="Arial, sans-serif" font-size="19" fill="#233d32">Historie + Vorgangskennung</text><path d="M1332 1330 L1362 1330" fill="none" stroke="#597567" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1327.0" y="1318.0" font-family="Arial, sans-serif" font-size="16" fill="#233d32"></text><rect x="1365" y="1260" width="400" height="145" rx="16" fill="white" stroke="#b9cbbd"/><text x="1383" y="1297" font-family="Arial, sans-serif" font-size="23" fill="#233d32" font-weight="700">4 · Anzeigen</text><text x="1383" y="1335" font-family="Arial, sans-serif" font-size="19" fill="#233d32">Steckbrief und Lebenslauf aktuell</text><text x="1383" y="1365" font-family="Arial, sans-serif" font-size="19" fill="#233d32">Neu-Badge nach Montage entfernt</text><text x="60" y="1455" font-family="Arial, sans-serif" font-size="20" fill="#637367">Transaktion: ganz oder gar nicht. Parallele/stale Anfragen werden abgewiesen; Wiederholungen sicher erkannt.</text><text x="60" y="1486" font-family="Arial, sans-serif" font-size="20" fill="#637367">Rückweg: Reifenpark per Instanzschalter deaktivierbar; Daten und Historien bleiben erhalten.</text></svg>