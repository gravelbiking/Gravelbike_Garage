services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    init: true
    env_file: ../.local/codespace/app.env
    environment:
      CODESPACES: ${CODESPACES:-false}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
    volumes:
      - ..:/workspaces/Gravelbike_Garage:cached
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: ../.local/codespace/db.env
    volumes:
      - garage-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  garage-database:
